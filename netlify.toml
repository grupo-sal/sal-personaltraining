[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [build.environment]
  # .env only holds public, browser-exposed VITE_ keys (e.g. the Google Maps
  # browser key), which smart detection flags as likely secrets.
  SECRETS_SCAN_OMIT_PATHS = ".env"
